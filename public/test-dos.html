<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JS-DOS v8 Test</title>
  <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
  <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: black; }
    #dos { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="dos"></div>
  <script>
    window.emulators.pathPrefix = "https://v8.js-dos.com/latest/emulators/";
    window.Dos(document.getElementById("dos"), {
      url: "https://archive.org/cors/msdos_Elder_Scrolls_The_-_Daggerfall_1996/Elder_Scrolls_The_-_Daggerfall_1996.zip"
    }).then(ci => {
      console.log("JS-DOS started!");
    }).catch(err => {
      console.error("JS-DOS failed:", err);
    });
  </script>
</body>
</html>
